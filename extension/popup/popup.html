<!doctype html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Nope</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <div class="logo">🛑 Nope</div>
      <div class="level-pill">Lv.3 Ninja</div>
    </div>

    <div class="status-pill" id="statusPill">
      <span class="dot" id="statusDot"></span>
      <span id="statusText">Loading...</span>
    </div>

    <div class="streak-hero-card">
      <div class="streak-label">🔥 Streak</div>
      <div class="streak-value" id="streakValue">0-day streak</div>
    </div>

    <div class="stats-row">
      <div class="mini-stat">
        <div class="mini-value" id="coinCount">0</div>
        <div class="mini-label">Coins</div>
      </div>
      <div class="mini-stat">
        <div class="mini-value" id="blockCount">0</div>
        <div class="mini-label">Blocks</div>
      </div>
    </div>

    <div class="level-bar">
      <div class="level-fill" id="levelFill"></div>
    </div>
    <div class="level-note" id="levelNote">15 blocks to Level 4</div>

    <button id="dashboardBtn" class="dashboard-btn">Open Dashboard →</button>

    <div class="footer" id="footerQuote">You're literally rewiring your brain right now 🧠</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
